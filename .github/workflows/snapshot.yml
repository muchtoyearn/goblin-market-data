name: market-snapshot
# GitHub's cron is best-effort and heavily throttled, so each run stays alive
# for ~5h40m and collects every 10 minutes itself. Hourly cron plus a
# self-dispatch at the end keep a run queued; concurrency prevents overlap.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  actions: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r collector/requirements.txt
      - name: Collect every 10 minutes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            start=$(date +%s)
            git rebase --abort 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            python collector/snapshot.py || echo "collector run failed"
            git add data/
            if ! git diff --cached --quiet; then
              git commit -m "data: snapshot $(date -u +%FT%TZ)" -q
              for i in 1 2 3; do git pull --rebase -q -X theirs && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 5; done
            fi
            elapsed=$(( $(date +%s) - start ))
            sleep $(( elapsed < 600 ? 600 - elapsed : 5 ))
          done
      - name: Queue next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run snapshot.yml -R "$GITHUB_REPOSITORY" || true
